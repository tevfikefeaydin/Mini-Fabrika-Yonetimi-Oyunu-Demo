<!DOCTYPE html>
<html lang="tr">
	<head>
		<meta charset="utf-8">
		<meta name="theme-color" content="#050b12">
		<meta name="description" content="Mini Fabrika — yüksek kontrastlı gece vardiyası fabrika yönetim demosu.">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Mini Fabrika</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: 3px solid #3de6f5;
	outline-offset: -3px;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #050b12;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

/* --- Nasıl Oynanır / How to Play overlay --- */
#tutorial-overlay {
	box-sizing: border-box;
	position: fixed;
	inset: 0;
	z-index: 100;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 1rem;
	background: rgba(5, 11, 18, 0.92);
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#tutorial-overlay[hidden] {
	display: none;
}

#tutorial-card {
	box-sizing: border-box;
	display: flex;
	flex-direction: column;
	width: 100%;
	max-width: 560px;
	max-height: calc(100vh - 2rem);
	max-height: calc(100dvh - 2rem);
	overflow: hidden;
	padding: 1.5rem 1.75rem;
	background: #0a1622;
	border: 1px solid #3de6f5;
	border-radius: 12px;
	box-shadow: 0 0 40px rgba(61, 230, 245, 0.15);
	color: #e6f6fa;
}

.tut-scroll {
	flex: 1 1 auto;
	min-height: 0;
	overflow-y: auto;
	padding-right: 0.35rem;
	scrollbar-gutter: stable;
}

#tutorial-card h1 {
	margin: 0 0 0.25rem;
	font-size: 1.4rem;
	letter-spacing: 0.5px;
	color: #3de6f5;
}

#tutorial-card h2 {
	margin: 1.1rem 0 0.4rem;
	font-size: 0.85rem;
	letter-spacing: 1px;
	text-transform: uppercase;
	color: #8fd8e6;
}

#tutorial-card p {
	margin: 0.35rem 0;
	font-size: 0.95rem;
	line-height: 1.5;
}

#tutorial-card ul {
	margin: 0.3rem 0;
	padding-left: 1.1rem;
	font-size: 0.95rem;
	line-height: 1.65;
}

#tutorial-card kbd {
	padding: 1px 6px;
	background: #04222b;
	border: 1px solid #2a5560;
	border-bottom-width: 2px;
	border-radius: 4px;
	font-family: monospace;
	font-size: 0.85em;
	color: #3de6f5;
}

.tut-actions {
	flex: none;
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 0.6rem;
	margin-top: 0.9rem;
	padding-top: 0.9rem;
	border-top: 1px solid rgba(143, 216, 230, 0.25);
}

.tut-btn {
	padding: 0.6rem 1.2rem;
	border: none;
	border-radius: 8px;
	font-size: 0.95rem;
	font-weight: 600;
	cursor: pointer;
}

.tut-btn--primary {
	flex: 1;
	min-width: 140px;
	background: #3de6f5;
	color: #04222b;
}

.tut-btn--ghost {
	margin-left: auto;
	background: transparent;
	border: 1px solid #2a5560;
	color: #8fd8e6;
}

#tutorial-help {
	position: fixed;
	right: 14px;
	bottom: max(76px, 10vh);
	z-index: 90;
	width: 40px;
	height: 40px;
	display: flex;
	align-items: center;
	justify-content: center;
	background: rgba(5, 11, 18, 0.8);
	border: 1px solid #3de6f5;
	border-radius: 50%;
	color: #3de6f5;
	font-size: 1.2rem;
	font-weight: 700;
	cursor: pointer;
}

#tutorial-help:hover {
	background: #04222b;
}

#tutorial-help[hidden] {
	display: none;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas" role="application" tabindex="0" aria-label="Mini Fabrika oyun alanı">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<button id="tutorial-help" type="button" title="Nasıl Oynanır" aria-label="Nasıl Oynanır" hidden>?</button>
		<div id="tutorial-overlay" role="dialog" aria-modal="true" aria-labelledby="tutorial-title" hidden>
			<div id="tutorial-card"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":510668,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
		<script>
// --- Nasıl Oynanır / How to Play overlay ---
(function () {
	const STORAGE_KEY = 'mf_tutorial_seen';
	const overlay = document.getElementById('tutorial-overlay');
	const card = document.getElementById('tutorial-card');
	const helpButton = document.getElementById('tutorial-help');

	const CONTENT = {
		tr: {
			title: 'Mini Fabrika — Nasıl Oynanır',
			intro: 'Gece vardiyasında bir masa vantilatörü üretim hattını yönetiyorsun. Hammadde al, soldaki hammadde iskelesinden sağdaki sevkiyat rampasına bir bant hattı döşe, makineleri bu hatta bağla, siparişleri zamanında yetiştir; enerji, bakım ve finansı dengede tut.',
			flowTitle: 'Temel Akış',
			flow: [
				'Hammadde stoğunu doldur.',
				'Soldaki <strong>hammadde iskelesinden</strong> sağdaki <strong>sevkiyat rampasına</strong> kadar <strong>kesintisiz tek bir bant hattı</strong> döşe.',
				'Makineleri bu hattın <strong>hemen yanına</strong>, ona değecek şekilde yerleştir — makineyi bandın üstüne koyup hattı ikiye bölme. Bir makine "GİRDİ HATTI YOK / ÇIKIŞ HATTI YOK" diyorsa hatta değmiyordur.',
				'Siparişleri kabul et ve üretimi ona göre ayarla.',
				'Enerjiyi ve bakımı takip et, arızaları onar.',
				'Finans ve vardiya raporlarından kârını izle; itibar arttıkça yeni ürünlerin açılır.',
			],
			controlsTitle: 'Kontroller',
			controls: [
				['Fare', 'yerleştirme, seçim ve arayüz işlemleri'],
				['Space', 'duraklat / devam et'],
				['1 · 2 · 4', 'oyun hızı'],
				['F', 'finans ekranı'],
				['Ctrl + S', 'kayıt'],
				['Ctrl + Shift + S', 'kayıt yöneticisi'],
			],
			start: 'Başla',
			langLabel: 'EN',
		},
		en: {
			title: 'Mini Fabrika — How to Play',
			intro: 'You run a desk-fan production line on the night shift. Buy raw materials, lay a belt line from the material dock on the left to the shipping ramp on the right, connect your machines to that line, fulfil orders on time, and keep energy, maintenance and finances balanced.',
			flowTitle: 'Core Loop',
			flow: [
				'Stock up on raw materials.',
				'Lay a <strong>single unbroken belt line</strong> from the <strong>material dock</strong> on the left to the <strong>shipping ramp</strong> on the right.',
				'Place machines <strong>right next to that line</strong> so they touch it — don\'t drop a machine on top of the belt and split the line in two. If a machine says "NO IN LINK / NO OUT LINK", it isn\'t touching the line.',
				'Accept orders and tune production to match.',
				'Watch energy and maintenance, and repair breakdowns.',
				'Track profit from the finance and shift reports; new products unlock as your reputation grows.',
			],
			controlsTitle: 'Controls',
			controls: [
				['Mouse', 'placement, selection and UI actions'],
				['Space', 'pause / resume'],
				['1 · 2 · 4', 'game speed'],
				['F', 'finance screen'],
				['Ctrl + S', 'save'],
				['Ctrl + Shift + S', 'save manager'],
			],
			start: 'Start',
			langLabel: 'TR',
		},
	};

	let lang = 'tr';

	function render() {
		const c = CONTENT[lang];
		const flowItems = c.flow.map((item) => '<li>' + item + '</li>').join('');
		const controlItems = c.controls
			.map((row) => '<li><kbd>' + row[0] + '</kbd> — ' + row[1] + '</li>')
			.join('');
		card.innerHTML =
			'<div class="tut-scroll">' +
			'<h1 id="tutorial-title">' + c.title + '</h1>' +
			'<p>' + c.intro + '</p>' +
			'<h2>' + c.flowTitle + '</h2><ul>' + flowItems + '</ul>' +
			'<h2>' + c.controlsTitle + '</h2><ul>' + controlItems + '</ul>' +
			'</div>' +
			'<div class="tut-actions">' +
			'<button type="button" class="tut-btn tut-btn--primary" data-action="start">' + c.start + '</button>' +
			'<button type="button" class="tut-btn tut-btn--ghost" data-action="lang">' + c.langLabel + '</button>' +
			'</div>';
	}

	function openOverlay() {
		render();
		overlay.hidden = false;
		const startButton = card.querySelector('[data-action="start"]');
		if (startButton) {
			startButton.focus();
		}
	}

	function closeOverlay() {
		overlay.hidden = true;
		try {
			window.localStorage.setItem(STORAGE_KEY, '1');
		} catch (err) { /* storage may be unavailable */ }
		const canvas = document.getElementById('canvas');
		if (canvas) {
			canvas.focus();
		}
	}

	card.addEventListener('click', function (event) {
		const action = event.target && event.target.getAttribute('data-action');
		if (action === 'start') {
			closeOverlay();
		} else if (action === 'lang') {
			lang = lang === 'tr' ? 'en' : 'tr';
			render();
			const langButton = card.querySelector('[data-action="lang"]');
			if (langButton) {
				langButton.focus();
			}
		}
	});

	helpButton.addEventListener('click', openOverlay);

	// While the overlay is open, keep keystrokes from reaching the game.
	window.addEventListener('keydown', function (event) {
		if (overlay.hidden) {
			return;
		}
		if (event.key === 'Escape') {
			closeOverlay();
		}
		event.stopPropagation();
	}, true);

	helpButton.hidden = false;

	let seen = false;
	try {
		seen = window.localStorage.getItem(STORAGE_KEY) === '1';
	} catch (err) { /* storage may be unavailable */ }
	if (!seen) {
		openOverlay();
	}
}());
		</script>
	</body>
</html>
